name: Build P6YTOK IPA

on:
  push:
    branches:
      - revive-tiktok-46.1.0
    paths-ignore:
      - .github/last-build-result.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6ytok-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak and package IPA
    runs-on: macos-14
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit compiled source files
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          makefile = Path("Makefile").read_text(encoding="utf-8")
          source_line = next(
              (line for line in makefile.splitlines() if line.startswith("P6YTOK_FILES =")),
              None,
          )
          if not source_line:
              raise SystemExit("P6YTOK_FILES is missing from Makefile")

          sources = source_line.split("=", 1)[1].strip().split()
          missing = [name for name in sources if not Path(name).is_file()]
          if missing:
              raise SystemExit(f"Missing compiled source files: {', '.join(missing)}")

          if "P6YKeychainFix.x" in sources:
              raise SystemExit("Unsafe global Keychain compatibility source is compiled")

          keychain_symbols = (
              "SecItemAdd", "SecItemCopyMatching", "SecItemUpdate",
              "SecItemDelete", "kSecAttrAccessGroup",
          )
          for source_name in sources:
              source_text = Path(source_name).read_text(encoding="utf-8")
              found = [symbol for symbol in keychain_symbols if symbol in source_text]
              if found:
                  raise SystemExit(
                      f"Authentication-sensitive Keychain symbols in {source_name}: {', '.join(found)}"
                  )

          logos_sources = [Path(name) for name in sources if name.endswith(".x")]
          for source in logos_sources:
              text = source.read_text(encoding="utf-8")
              block_count = sum([
                  len(re.findall(r"(?m)^\s*%hook\s+\S+", text)),
                  len(re.findall(r"(?m)^\s*%group\s+\S+", text)),
                  len(re.findall(r"(?m)^\s*%subclass\s+\S+", text)),
              ])
              end_count = len(re.findall(r"(?m)^\s*%end(?:\s|$)", text))
              if block_count != end_count:
                  raise SystemExit(f"Unbalanced Logos blocks in {source}: {block_count} openings, {end_count} endings")

          tweak = Path("Tweak.x").read_text(encoding="utf-8")
          if tweak.count("static void P6YConfirmVoidAction") != 1:
              raise SystemExit("Invalid P6YConfirmVoidAction helper count")
          if tweak.count("static void P6YConfirmObjectAction") != 1:
              raise SystemExit("Invalid P6YConfirmObjectAction helper count")

          hook_start = tweak.index("%hook TTKCommentPanelViewController")
          hook_end = tweak.index("%end", hook_start)
          if "self.view" in tweak[hook_start:hook_end]:
              raise SystemExit("Forward-class self.view access remains")

          print("Compiled source audit passed")
          PY

      - name: Resolve base IPA release asset
        id: base_ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASES="$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASES"

          ASSET_API_URL="$(python3 - "$RELEASES" <<'PY'
          import json
          import sys

          raw = json.load(open(sys.argv[1], encoding="utf-8"))
          releases = raw if isinstance(raw, list) else [raw]
          candidates = []
          for release in releases:
              if release.get("draft"):
                  continue
              for asset in release.get("assets", []):
                  name = str(asset.get("name", ""))
                  lower = name.lower()
                  if not lower.endswith(".ipa"):
                      continue
                  if any(token in lower for token in ("p6ytok", "patched", "injected")):
                      continue
                  candidates.append(asset)

          if not candidates:
              raise SystemExit("No usable base IPA release asset found")

          preferred = [asset for asset in candidates if any(
              token in str(asset.get("name", "")).lower()
              for token in ("46.1.0", "461034", "tiktok")
          )]
          selected = (preferred or candidates)[0]
          print(selected["url"])
          PY
          )"

          echo "asset_api_url=$ASSET_API_URL" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install make ldid dpkg coreutils gnu-sed findutils >/dev/null
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix findutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Build P6YTOK serially
        run: |
          set -euo pipefail
          rm -rf packages .theos artifacts
          mkdir -p artifacts
          make -j1 clean package FINALPACKAGE=1 2>&1 | tee artifacts/build.log
          DEB="$(find packages -type f -name '*.deb' -print | sort | tail -n 1)"
          test -n "$DEB"
          cp "$DEB" artifacts/P6YTOK_0.2.0-alpha2_iphoneos-arm.deb
          echo "DEB_PATH=$GITHUB_WORKSPACE/artifacts/P6YTOK_0.2.0-alpha2_iphoneos-arm.deb" >> "$GITHUB_ENV"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-build-log
          path: artifacts/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tweak package
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-deb
          path: artifacts/P6YTOK_0.2.0-alpha2_iphoneos-arm.deb
          if-no-files-found: error
          retention-days: 14

      - name: Download and validate TikTok IPA
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_API_URL: ${{ steps.base_ipa.outputs.asset_api_url }}
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/TikTok_46.1.0_decrypted.ipa"
          gh api -H "Accept: application/octet-stream" "$ASSET_API_URL" > "$BASE_IPA"
          unzip -tq "$BASE_IPA"

          CHECK_DIR="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$BASE_IPA" -d "$CHECK_DIR"
          APP_DIR="$(find "$CHECK_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP_DIR"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist")"
          if [[ "$VERSION" != "46.1.0" || "$BUILD" != "461034" || "$BUNDLE_ID" != "com.zhiliaoapp.musically" ]]; then
            echo "Expected TikTok 46.1.0 (461034), com.zhiliaoapp.musically; received $VERSION ($BUILD), $BUNDLE_ID" >&2
            exit 1
          fi
          echo "BASE_IPA=$BASE_IPA" >> "$GITHUB_ENV"

      - name: Install Azule
        run: |
          set -euo pipefail
          AZULE_DIR="$RUNNER_TEMP/Azule"
          git clone -q --depth 1 https://github.com/mpelteshki/Azule.git "$AZULE_DIR"
          chmod +x "$AZULE_DIR/azule"
          echo "AZULE_DIR=$AZULE_DIR" >> "$GITHUB_ENV"

      - name: Inject tweak and create IPA
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/p6ytok-output"
          mkdir -p "$OUTPUT_DIR"
          "$AZULE_DIR/azule" -i "$BASE_IPA" -o "$OUTPUT_DIR" -f "$DEB_PATH"
          BUILT_IPA="$(find "$OUTPUT_DIR" -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -n "$BUILT_IPA"
          cp "$BUILT_IPA" artifacts/P6YTOK_TikTok_46.1.0.ipa

      - name: Upload P6YTOK IPA
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-TikTok-46.1.0-IPA
          path: artifacts/P6YTOK_TikTok_46.1.0.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
