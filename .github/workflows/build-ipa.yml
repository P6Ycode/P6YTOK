name: Build P6YTOK IPA

on:
  push:
    branches:
      - revive-tiktok-46.1.0
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Optional direct decrypted TikTok 46.1.0 IPA URL; otherwise the newest IPA in this repository's latest release is used
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: p6ytok-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak and package IPA
    runs-on: macos-14
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
      IPA_URL: ${{ inputs.ipa_url || secrets.P6YTOK_IPA_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve base IPA
        id: ipa_input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${IPA_URL:-}" ]]; then
            echo "source=URL input or secret" >> "$GITHUB_OUTPUT"
          else
            RELEASE_JSON="$RUNNER_TEMP/latest-release.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" \
              --output "$RELEASE_JSON"
            IPA_URL="$(python3 - "$RELEASE_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              release = json.load(handle)

          assets = [
              asset for asset in release.get("assets", [])
              if str(asset.get("name", "")).lower().endswith(".ipa")
          ]
          if not assets:
              raise SystemExit("The latest release has no .ipa asset")

          preferred = [
              asset for asset in assets
              if "46.1.0" in str(asset.get("name", ""))
              or "461034" in str(asset.get("name", ""))
              or "tiktok" in str(asset.get("name", "")).lower()
          ]
          selected = (preferred or assets)[0]
          print(selected["browser_download_url"])
          PY
            )"
            echo "IPA_URL=$IPA_URL" >> "$GITHUB_ENV"
            echo "source=latest release asset" >> "$GITHUB_OUTPUT"
          fi
          echo "Base IPA source: $(cat "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        run: |
          brew update
          brew install make ldid dpkg coreutils gnu-sed findutils
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix findutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Build P6YTOK package
        run: |
          set -euo pipefail
          rm -rf packages .theos artifacts
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          make clean package FINALPACKAGE=1 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/build.log"
          DEB="$(find "$GITHUB_WORKSPACE/packages" -type f -name '*.deb' -print | sort | tail -n 1)"
          test -n "$DEB"
          cp "$DEB" "$GITHUB_WORKSPACE/artifacts/P6YTOK_0.1.6_iphoneos-arm.deb"
          echo "DEB_PATH=$GITHUB_WORKSPACE/artifacts/P6YTOK_0.1.6_iphoneos-arm.deb" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-build-log
          path: artifacts/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tweak package
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-deb
          path: artifacts/P6YTOK_0.1.6_iphoneos-arm.deb
          if-no-files-found: error
          retention-days: 14

      - name: Download and validate base IPA
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/TikTok_46.1.0_decrypted.ipa"
          curl --fail --location --retry 3 --retry-delay 3 "$IPA_URL" --output "$BASE_IPA"
          unzip -tq "$BASE_IPA"
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$BASE_IPA" -d "$RUNNER_TEMP/ipa-check"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP_DIR"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist")"
          if [[ "$VERSION" != "46.1.0" || "$BUILD" != "461034" || "$BUNDLE_ID" != "com.zhiliaoapp.musically" ]]; then
            echo "Expected TikTok 46.1.0 (461034), com.zhiliaoapp.musically; received $VERSION ($BUILD), $BUNDLE_ID." >&2
            exit 1
          fi
          echo "BASE_IPA=$BASE_IPA" >> "$GITHUB_ENV"

      - name: Install Azule injector
        run: |
          set -euo pipefail
          AZULE_DIR="$RUNNER_TEMP/Azule"
          git clone --depth 1 https://github.com/mpelteshki/Azule.git "$AZULE_DIR"
          chmod +x "$AZULE_DIR/azule"
          echo "AZULE_DIR=$AZULE_DIR" >> "$GITHUB_ENV"

      - name: Inject P6YTOK and create IPA
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/p6ytok-output"
          mkdir -p "$OUTPUT_DIR"
          "$AZULE_DIR/azule" -i "$BASE_IPA" -o "$OUTPUT_DIR" -f "$DEB_PATH"
          BUILT_IPA="$(find "$OUTPUT_DIR" -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -n "$BUILT_IPA"
          cp "$BUILT_IPA" "$GITHUB_WORKSPACE/artifacts/P6YTOK_TikTok_46.1.0.ipa"
          {
            echo "## IPA built"
            echo
            echo "Artifact: \`P6YTOK_TikTok_46.1.0.ipa\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-TikTok-46.1.0-IPA
          path: artifacts/P6YTOK_TikTok_46.1.0.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
