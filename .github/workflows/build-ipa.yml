name: Build P6YTOK IPA

on:
  push:
    branches:
      - revive-tiktok-46.1.0
    paths-ignore:
      - .github/last-build-result.txt
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Optional direct decrypted TikTok 46.1.0 IPA URL; otherwise a matching IPA release asset is used
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: p6ytok-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak and package IPA
    runs-on: macos-14
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
      IPA_URL: ${{ inputs.ipa_url || secrets.P6YTOK_IPA_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve base IPA
        id: ipa_input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${IPA_URL:-}" ]]; then
            SOURCE_DESCRIPTION="URL input or secret"
          else
            RELEASE_JSON="$RUNNER_TEMP/releases.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=20" \
              --output "$RELEASE_JSON"
            IPA_URL="$(python3 - "$RELEASE_JSON" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              releases = json.load(handle)

          assets = []
          for release in releases:
              if release.get("draft"):
                  continue
              for asset in release.get("assets", []):
                  name = str(asset.get("name", ""))
                  lower = name.lower()
                  if not lower.endswith(".ipa"):
                      continue
                  if any(token in lower for token in ("p6ytok", "patched", "injected")):
                      continue
                  assets.append(asset)

          if not assets:
              raise SystemExit("No usable base .ipa asset was found in the repository releases")

          preferred = [
              asset for asset in assets
              if "46.1.0" in str(asset.get("name", ""))
              or "461034" in str(asset.get("name", ""))
              or "tiktok" in str(asset.get("name", "")).lower()
          ]
          selected = (preferred or assets)[0]
          print(selected["browser_download_url"])
          PY
            )"
            echo "IPA_URL=$IPA_URL" >> "$GITHUB_ENV"
            SOURCE_DESCRIPTION="repository release asset"
          fi
          echo "source=$SOURCE_DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "Base IPA source: $SOURCE_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install make ldid dpkg coreutils gnu-sed findutils >/dev/null
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix findutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Build P6YTOK package
        run: |
          set -euo pipefail
          rm -rf packages .theos artifacts
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          make clean package FINALPACKAGE=1 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/build.log"
          DEB="$(find "$GITHUB_WORKSPACE/packages" -type f -name '*.deb' -print | sort | tail -n 1)"
          test -n "$DEB"
          cp "$DEB" "$GITHUB_WORKSPACE/artifacts/P6YTOK_0.1.6_iphoneos-arm.deb"
          echo "DEB_PATH=$GITHUB_WORKSPACE/artifacts/P6YTOK_0.1.6_iphoneos-arm.deb" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-build-log
          path: artifacts/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tweak package
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-deb
          path: artifacts/P6YTOK_0.1.6_iphoneos-arm.deb
          if-no-files-found: error
          retention-days: 14

      - name: Download and validate base IPA
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/TikTok_46.1.0_decrypted.ipa"
          curl --fail --location --retry 3 --retry-delay 3 "$IPA_URL" --output "$BASE_IPA"
          unzip -tq "$BASE_IPA"
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$BASE_IPA" -d "$RUNNER_TEMP/ipa-check"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP_DIR"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist")"
          if [[ "$VERSION" != "46.1.0" || "$BUILD" != "461034" || "$BUNDLE_ID" != "com.zhiliaoapp.musically" ]]; then
            echo "Expected TikTok 46.1.0 (461034), com.zhiliaoapp.musically; received $VERSION ($BUILD), $BUNDLE_ID." >&2
            exit 1
          fi
          echo "BASE_IPA=$BASE_IPA" >> "$GITHUB_ENV"

      - name: Install Azule injector
        run: |
          set -euo pipefail
          AZULE_DIR="$RUNNER_TEMP/Azule"
          git clone -q --depth 1 https://github.com/mpelteshki/Azule.git "$AZULE_DIR"
          chmod +x "$AZULE_DIR/azule"
          echo "AZULE_DIR=$AZULE_DIR" >> "$GITHUB_ENV"

      - name: Inject P6YTOK and create IPA
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/p6ytok-output"
          mkdir -p "$OUTPUT_DIR"
          "$AZULE_DIR/azule" -i "$BASE_IPA" -o "$OUTPUT_DIR" -f "$DEB_PATH"
          BUILT_IPA="$(find "$OUTPUT_DIR" -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -n "$BUILT_IPA"
          cp "$BUILT_IPA" "$GITHUB_WORKSPACE/artifacts/P6YTOK_TikTok_46.1.0.ipa"
          {
            echo "## IPA built"
            echo
            echo "Artifact: \`P6YTOK_TikTok_46.1.0.ipa\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-TikTok-46.1.0-IPA
          path: artifacts/P6YTOK_TikTok_46.1.0.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish concise build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          log_path = pathlib.Path("artifacts/build.log")
          lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []
          interesting = []
          markers = (" error:", "fatal error:", "undefined symbols", "make[", "expected '")
          indexes = [i for i, line in enumerate(lines) if any(marker in line.lower() for marker in markers)]
          for index in indexes[:8]:
              start = max(0, index - 4)
              end = min(len(lines), index + 10)
              interesting.extend(lines[start:end])
              interesting.append("---")
          if not interesting and lines:
              interesting = lines[-80:]
          if len(interesting) > 160:
              interesting = interesting[:160]

          report = "\n".join([
              f"Status: {os.environ['BUILD_STATUS']}",
              f"Run: {os.environ['RUN_URL']}",
              f"Source commit: {os.environ['HEAD_SHA']}",
              "",
              "Relevant output:",
              *(interesting or ["No build log was created."]),
              "",
          ])

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["BRANCH_NAME"]
          path = ".github/last-build-result.txt"
          url = f"{api}/repos/{repo}/contents/{path}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          sha = None
          try:
              request = urllib.request.Request(
                  f"{url}?ref={urllib.parse.quote(branch)}", headers=headers
              )
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response).get("sha")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          payload = {
              "message": "Record latest P6YTOK build result [skip ci]",
              "branch": branch,
              "content": base64.b64encode(report.encode()).decode(),
          }
          if sha:
              payload["sha"] = sha
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              headers=headers,
              method="PUT",
          )
          with urllib.request.urlopen(request) as response:
              json.load(response)
          PY
