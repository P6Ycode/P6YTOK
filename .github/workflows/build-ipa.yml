name: Build P6YTOK IPA

on:
  push:
    branches:
      - revive-tiktok-46.1.0
    paths-ignore:
      - .github/last-build-result.txt
      - .github/workflows/repair-final.yml
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Optional direct decrypted TikTok 46.1.0 IPA URL; otherwise a matching repository release asset is used
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: p6ytok-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak and package IPA
    runs-on: macos-14
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
      IPA_URL: ${{ inputs.ipa_url || secrets.P6YTOK_IPA_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare compatible Logos source
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Tweak.x")
          text = path.read_text(encoding="utf-8")
          start = text.index("static void P6YConfirmVoidAction")
          end = text.index("%hook AWETextInputController", start)
          replacement = r'''static void P6YConfirmVoidAction(id object, const void *bypassKey, SEL selector, NSString *message) {
              __weak id weakObject = object;
              [P6YManager presentConfirmationWithTitle:@"P6YTOK" message:message from:nil confirmed:^{
                  id strongObject = weakObject;
                  if (!strongObject) return;
                  objc_setAssociatedObject(strongObject, bypassKey, @YES, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  ((void (*)(id, SEL))objc_msgSend)(strongObject, selector);
              }];
          }

          static void P6YConfirmObjectAction(id object, id argument, const void *bypassKey, SEL selector, NSString *message) {
              __weak id weakObject = object;
              [P6YManager presentConfirmationWithTitle:@"P6YTOK" message:message from:nil confirmed:^{
                  id strongObject = weakObject;
                  if (!strongObject) return;
                  objc_setAssociatedObject(strongObject, bypassKey, @YES, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  ((void (*)(id, SEL, id))objc_msgSend)(strongObject, selector, argument);
              }];
          }

          %hook AWEFeedVideoButton
          - (void)_onTouchUpInside {
              NSString *imageName = [[P6YGet(self, @"imageNameString") description] lowercaseString];
              BOOL isLikeButton = [imageName containsString:@"like"] || [imageName containsString:@"digg"];
              BOOL enabled = [P6YManager boolForKey:@"p6y_confirm_like"] && isLikeButton;
              BOOL bypass = [objc_getAssociatedObject(self, P6YLikeBypassKey) boolValue];
              if (enabled && !bypass) {
                  P6YConfirmVoidAction(self, P6YLikeBypassKey, @selector(_onTouchUpInside), @"Like this post?");
                  return;
              }
              if (bypass) objc_setAssociatedObject(self, P6YLikeBypassKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              %orig;
          }
          %end

          %hook AWECommentPanelBaseCell
          - (void)onLikeAction:(id)sender {
              BOOL enabled = [P6YManager boolForKey:@"p6y_confirm_comment_like"];
              BOOL bypass = [objc_getAssociatedObject(self, P6YCommentLikeBypassKey) boolValue];
              if (enabled && !bypass) {
                  P6YConfirmObjectAction(self, sender, P6YCommentLikeBypassKey, @selector(onLikeAction:), @"Like this comment?");
                  return;
              }
              if (bypass) objc_setAssociatedObject(self, P6YCommentLikeBypassKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              %orig;
          }
          - (void)onDislikeAction:(id)sender {
              BOOL enabled = [P6YManager boolForKey:@"p6y_confirm_comment_dislike"];
              BOOL bypass = [objc_getAssociatedObject(self, P6YCommentDislikeBypassKey) boolValue];
              if (enabled && !bypass) {
                  P6YConfirmObjectAction(self, sender, P6YCommentDislikeBypassKey, @selector(onDislikeAction:), @"Dislike this comment?");
                  return;
              }
              if (bypass) objc_setAssociatedObject(self, P6YCommentDislikeBypassKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              %orig;
          }
          %end

          %hook _TtC17TikTokCommentImpl18TTKCommentItemView
          - (void)onLikeTapped {
              BOOL enabled = [P6YManager boolForKey:@"p6y_confirm_comment_like"];
              BOOL bypass = [objc_getAssociatedObject(self, P6YCommentLikeBypassKey) boolValue];
              if (enabled && !bypass) {
                  P6YConfirmVoidAction(self, P6YCommentLikeBypassKey, @selector(onLikeTapped), @"Like this comment?");
                  return;
              }
              if (bypass) objc_setAssociatedObject(self, P6YCommentLikeBypassKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              %orig;
          }
          - (void)onDislikeTapped {
              BOOL enabled = [P6YManager boolForKey:@"p6y_confirm_comment_dislike"];
              BOOL bypass = [objc_getAssociatedObject(self, P6YCommentDislikeBypassKey) boolValue];
              if (enabled && !bypass) {
                  P6YConfirmVoidAction(self, P6YCommentDislikeBypassKey, @selector(onDislikeTapped), @"Dislike this comment?");
                  return;
              }
              if (bypass) objc_setAssociatedObject(self, P6YCommentDislikeBypassKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              %orig;
          }
          %end

          %hook TTKRelationButtonViewModelV2
          - (void)onRelationViewTapped {
              BOOL enabled = [P6YManager boolForKey:@"p6y_confirm_follow"];
              BOOL bypass = [objc_getAssociatedObject(self, P6YFollowBypassKey) boolValue];
              if (enabled && !bypass) {
                  P6YConfirmVoidAction(self, P6YFollowBypassKey, @selector(onRelationViewTapped), @"Change this follow relationship?");
                  return;
              }
              if (bypass) objc_setAssociatedObject(self, P6YFollowBypassKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              %orig;
          }
          %end

          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Resolve base IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${IPA_URL:-}" ]]; then
            RELEASES="$RUNNER_TEMP/releases.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=20" \
              --output "$RELEASES"
            IPA_URL="$(python3 - "$RELEASES" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              releases = json.load(handle)

          candidates = []
          for release in releases:
              if release.get("draft"):
                  continue
              for asset in release.get("assets", []):
                  name = str(asset.get("name", ""))
                  lower = name.lower()
                  if not lower.endswith(".ipa"):
                      continue
                  if any(word in lower for word in ("p6ytok", "patched", "injected")):
                      continue
                  candidates.append(asset)

          if not candidates:
              raise SystemExit("No usable base IPA release asset found")

          preferred = [asset for asset in candidates if any(
              token in str(asset.get("name", "")).lower()
              for token in ("46.1.0", "461034", "tiktok")
          )]
          print((preferred or candidates)[0]["browser_download_url"])
          PY
            )"
          fi
          echo "IPA_URL=$IPA_URL" >> "$GITHUB_ENV"

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install make ldid dpkg coreutils gnu-sed findutils >/dev/null
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix findutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Build P6YTOK package
        run: |
          set -euo pipefail
          rm -rf packages .theos artifacts
          mkdir -p artifacts
          make clean package FINALPACKAGE=1 2>&1 | tee artifacts/build.log
          DEB="$(find packages -type f -name '*.deb' -print | sort | tail -n 1)"
          test -n "$DEB"
          cp "$DEB" artifacts/P6YTOK_0.1.6_iphoneos-arm.deb
          echo "DEB_PATH=$GITHUB_WORKSPACE/artifacts/P6YTOK_0.1.6_iphoneos-arm.deb" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-build-log
          path: artifacts/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tweak package
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-deb
          path: artifacts/P6YTOK_0.1.6_iphoneos-arm.deb
          if-no-files-found: error
          retention-days: 14

      - name: Download and validate base IPA
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/TikTok_46.1.0_decrypted.ipa"
          curl --fail --location --retry 3 --retry-delay 3 "$IPA_URL" --output "$BASE_IPA"
          unzip -tq "$BASE_IPA"
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$BASE_IPA" -d "$RUNNER_TEMP/ipa-check"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP_DIR"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist")"
          if [[ "$VERSION" != "46.1.0" || "$BUILD" != "461034" || "$BUNDLE_ID" != "com.zhiliaoapp.musically" ]]; then
            echo "Expected TikTok 46.1.0 (461034), com.zhiliaoapp.musically; received $VERSION ($BUILD), $BUNDLE_ID." >&2
            exit 1
          fi
          echo "BASE_IPA=$BASE_IPA" >> "$GITHUB_ENV"

      - name: Install Azule injector
        run: |
          AZULE_DIR="$RUNNER_TEMP/Azule"
          git clone -q --depth 1 https://github.com/mpelteshki/Azule.git "$AZULE_DIR"
          chmod +x "$AZULE_DIR/azule"
          echo "AZULE_DIR=$AZULE_DIR" >> "$GITHUB_ENV"

      - name: Inject P6YTOK and create IPA
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/p6ytok-output"
          mkdir -p "$OUTPUT_DIR"
          "$AZULE_DIR/azule" -i "$BASE_IPA" -o "$OUTPUT_DIR" -f "$DEB_PATH"
          BUILT_IPA="$(find "$OUTPUT_DIR" -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -n "$BUILT_IPA"
          cp "$BUILT_IPA" artifacts/P6YTOK_TikTok_46.1.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-TikTok-46.1.0-IPA
          path: artifacts/P6YTOK_TikTok_46.1.0.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
