name: Build P6YTOK IPA

on:
  push:
    branches:
      - revive-tiktok-46.1.0
    paths-ignore:
      - .github/last-build-result.txt
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Optional direct decrypted TikTok 46.1.0 IPA URL; otherwise a matching repository release asset is used
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: p6ytok-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tweak and package IPA
    runs-on: macos-14
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
      IPA_URL: ${{ inputs.ipa_url || secrets.P6YTOK_IPA_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Audit source structure
        run: |
          python3 <<'PY'
          from pathlib import Path

          def strip_comments_and_literals(text: str) -> str:
              output = []
              state = "normal"
              index = 0
              while index < len(text):
                  char = text[index]
                  next_char = text[index + 1] if index + 1 < len(text) else ""
                  if state == "normal":
                      if char == "/" and next_char == "/":
                          state = "line_comment"
                          output.extend("  ")
                          index += 2
                          continue
                      if char == "/" and next_char == "*":
                          state = "block_comment"
                          output.extend("  ")
                          index += 2
                          continue
                      if char == '"':
                          state = "string"
                          output.append(" ")
                          index += 1
                          continue
                      if char == "'":
                          state = "char"
                          output.append(" ")
                          index += 1
                          continue
                      output.append(char)
                  elif state == "line_comment":
                      if char == "\n":
                          state = "normal"
                          output.append("\n")
                      else:
                          output.append(" ")
                  elif state == "block_comment":
                      if char == "*" and next_char == "/":
                          state = "normal"
                          output.extend("  ")
                          index += 2
                          continue
                      output.append("\n" if char == "\n" else " ")
                  elif state in ("string", "char"):
                      if char == "\\":
                          output.extend("  ")
                          index += 2
                          continue
                      closing = '"' if state == "string" else "'"
                      if char == closing:
                          state = "normal"
                      output.append("\n" if char == "\n" else " ")
                  index += 1
              return "".join(output)

          sources = [Path(name) for name in (
              "Tweak.x", "P6YMediaQuality.x", "P6YLiveZoom.x", "P6YFollowerTracker.x",
              "P6YStoryTimer.m", "P6YLikesCleanup.m", "P6YManager.m",
              "P6YDownloadManager.m", "P6YDownloadManager+FullQuality.m",
              "SettingsViewController.m"
          )]
          missing = [str(path) for path in sources if not path.exists()]
          if missing:
              raise SystemExit(f"Missing source files: {missing}")

          for path in sources:
              text = path.read_text(encoding="utf-8")
              clean = strip_comments_and_literals(text)
              for opening, closing, label in (("{", "}", "braces"), ("(", ")", "parentheses"), ("[", "]", "brackets")):
                  depth = 0
                  for line_number, line in enumerate(clean.splitlines(), 1):
                      for char in line:
                          if char == opening:
                              depth += 1
                          elif char == closing:
                              depth -= 1
                              if depth < 0:
                                  raise SystemExit(f"{path}:{line_number}: unmatched closing {closing}")
                  if depth != 0:
                      raise SystemExit(f"{path}: unbalanced {label}: {depth}")

              if path.suffix == ".x":
                  if text.count("%hook") != text.count("%end"):
                      raise SystemExit(f"{path}: unbalanced %hook/%end")
                  if "{ %orig;" in text or "%orig; return;" in text:
                      raise SystemExit(f"{path}: inline %orig control flow remains")
                  cursor = 0
                  while True:
                      start = text.find("%hook", cursor)
                      if start < 0:
                          break
                      end = text.find("%end", start)
                      if end < 0:
                          raise SystemExit(f"{path}: hook without %end")
                      if "^{" in text[start:end]:
                          raise SystemExit(f"{path}: block literal remains inside a Logos hook")
                      cursor = end + 4

          tweak = Path("Tweak.x").read_text(encoding="utf-8")
          if tweak.count("static void P6YConfirmVoidAction") != 1:
              raise SystemExit("Tweak.x must contain exactly one P6YConfirmVoidAction helper")
          if tweak.count("static void P6YConfirmObjectAction") != 1:
              raise SystemExit("Tweak.x must contain exactly one P6YConfirmObjectAction helper")
          print("Source audit passed")
          PY

      - name: Resolve base IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${IPA_URL:-}" ]]; then
            RELEASES="$RUNNER_TEMP/releases.json"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=20" \
              --output "$RELEASES"
            IPA_URL="$(python3 - "$RELEASES" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              releases = json.load(handle)

          candidates = []
          for release in releases:
              if release.get("draft"):
                  continue
              for asset in release.get("assets", []):
                  name = str(asset.get("name", ""))
                  lower = name.lower()
                  if not lower.endswith(".ipa"):
                      continue
                  if any(word in lower for word in ("p6ytok", "patched", "injected")):
                      continue
                  candidates.append(asset)

          if not candidates:
              raise SystemExit("No usable base IPA release asset found")

          preferred = [asset for asset in candidates if any(
              token in str(asset.get("name", "")).lower()
              for token in ("46.1.0", "461034", "tiktok")
          )]
          selected = (preferred or candidates)[0]
          print(selected["browser_download_url"])
          PY
            )"
          fi
          echo "IPA_URL=$IPA_URL" >> "$GITHUB_ENV"

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install make ldid dpkg coreutils gnu-sed findutils >/dev/null
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix findutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Build P6YTOK package serially
        run: |
          set -euo pipefail
          rm -rf packages .theos artifacts
          mkdir -p artifacts
          make -j1 clean package FINALPACKAGE=1 2>&1 | tee artifacts/build.log
          DEB="$(find packages -type f -name '*.deb' -print | sort | tail -n 1)"
          test -n "$DEB"
          cp "$DEB" artifacts/P6YTOK_0.1.6_iphoneos-arm.deb
          echo "DEB_PATH=$GITHUB_WORKSPACE/artifacts/P6YTOK_0.1.6_iphoneos-arm.deb" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-build-log
          path: artifacts/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tweak package
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-deb
          path: artifacts/P6YTOK_0.1.6_iphoneos-arm.deb
          if-no-files-found: error
          retention-days: 14

      - name: Download and validate base IPA
        run: |
          set -euo pipefail
          BASE_IPA="$RUNNER_TEMP/TikTok_46.1.0_decrypted.ipa"
          curl --fail --location --retry 3 --retry-delay 3 "$IPA_URL" --output "$BASE_IPA"
          unzip -tq "$BASE_IPA"
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q "$BASE_IPA" -d "$RUNNER_TEMP/ipa-check"
          APP_DIR="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP_DIR"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_DIR/Info.plist")"
          if [[ "$VERSION" != "46.1.0" || "$BUILD" != "461034" || "$BUNDLE_ID" != "com.zhiliaoapp.musically" ]]; then
            echo "Expected TikTok 46.1.0 (461034), com.zhiliaoapp.musically; received $VERSION ($BUILD), $BUNDLE_ID." >&2
            exit 1
          fi
          echo "BASE_IPA=$BASE_IPA" >> "$GITHUB_ENV"

      - name: Install Azule injector
        run: |
          set -euo pipefail
          AZULE_DIR="$RUNNER_TEMP/Azule"
          git clone -q --depth 1 https://github.com/mpelteshki/Azule.git "$AZULE_DIR"
          chmod +x "$AZULE_DIR/azule"
          echo "AZULE_DIR=$AZULE_DIR" >> "$GITHUB_ENV"

      - name: Inject P6YTOK and create IPA
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/p6ytok-output"
          mkdir -p "$OUTPUT_DIR"
          "$AZULE_DIR/azule" -i "$BASE_IPA" -o "$OUTPUT_DIR" -f "$DEB_PATH"
          BUILT_IPA="$(find "$OUTPUT_DIR" -type f -name '*.ipa' -print | sort | tail -n 1)"
          test -n "$BUILT_IPA"
          cp "$BUILT_IPA" artifacts/P6YTOK_TikTok_46.1.0.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P6YTOK-TikTok-46.1.0-IPA
          path: artifacts/P6YTOK_TikTok_46.1.0.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          log = pathlib.Path("artifacts/build.log")
          lines = log.read_text(errors="replace").splitlines() if log.exists() else []
          markers = (" error:", "fatal error:", "undefined symbols", "make[", "expected '", "no usable base", "curl:")
          indexes = [index for index, line in enumerate(lines) if any(marker in line.lower() for marker in markers)]
          relevant = []
          for index in indexes[:12]:
              relevant.extend(lines[max(0, index - 4):min(len(lines), index + 12)])
              relevant.append("---")
          if not relevant and lines:
              relevant = lines[-120:]
          relevant = relevant[:220]

          report = "\n".join([
              f"Status: {os.environ['BUILD_STATUS']}",
              f"Run: {os.environ['RUN_URL']}",
              f"Source commit: {os.environ['HEAD_SHA']}",
              "",
              "Relevant output:",
              *(relevant or ["No compiler log was created."]),
              "",
          ])

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["BRANCH_NAME"]
          path = ".github/last-build-result.txt"
          url = f"{api}/repos/{repo}/contents/{path}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          sha = None
          try:
              request = urllib.request.Request(f"{url}?ref={urllib.parse.quote(branch)}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  sha = json.load(response).get("sha")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          payload = {
              "message": "Record latest P6YTOK build result [skip ci]",
              "branch": branch,
              "content": base64.b64encode(report.encode()).decode(),
          }
          if sha:
              payload["sha"] = sha
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers, method="PUT")
          with urllib.request.urlopen(request) as response:
              json.load(response)
          PY
