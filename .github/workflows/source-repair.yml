name: Repair all Logos source patterns

on:
  push:
    branches:
      - revive-tiktok-46.1.0
    paths:
      - .github/workflows/source-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revive-tiktok-46.1.0
          fetch-depth: 0

      - name: Refactor risky Logos hook bodies
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_hook(text: str, hook_name: str, replacement: str) -> str:
              marker = f"%hook {hook_name}"
              start = text.index(marker)
              end = text.index("%end", start) + len("%end")
              return text[:start] + replacement.rstrip() + text[end:]

          tweak_path = Path("Tweak.x")
          tweak = tweak_path.read_text(encoding="utf-8")

          tweak = replace_hook(tweak, "AWEAwemeModel", r'''%hook AWEAwemeModel
          - (BOOL)progressBarDraggable {
              BOOL original = %orig;
              return [P6YManager boolForKey:@"p6y_download_progress"] || original;
          }

          - (BOOL)progressBarVisible {
              BOOL original = %orig;
              return [P6YManager boolForKey:@"p6y_download_progress"] || original;
          }

          - (BOOL)shouldShowMaskView:(BOOL)argument {
              if ([P6YManager boolForKey:@"p6y_disable_warnings"]) return NO;
              return %orig(argument);
          }
          %end''')

          tweak = replace_hook(tweak, "AWEFeedCellViewController", r'''%hook AWEFeedCellViewController
          - (void)playerWillLoopPlaying:(id)player {
              NSInteger action = [P6YManager integerForKey:@"p6y_playback_action"];
              if (action == 0) {
                  %orig(player);
                  return;
              }
              if (action == 1) return;

              UIViewController *feed = P6YFindFeedController(self);
              if (P6YResponds(feed, @"scrollToNextVideo")) {
                  ((void (*)(id, SEL))objc_msgSend)(feed, NSSelectorFromString(@"scrollToNextVideo"));
                  return;
              }
              %orig(player);
          }
          %end''')

          startup_helper = r'''static void P6YScheduleStartupPage(id controller, NSInteger page) {
              __weak id weakController = controller;
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.45 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  id strongSelf = weakController;
                  if (!strongSelf || !P6YResponds(strongSelf, @"numberOfTabs")) return;
                  NSUInteger count = ((NSUInteger (*)(id, SEL))objc_msgSend)(strongSelf, NSSelectorFromString(@"numberOfTabs"));
                  for (NSUInteger index = 0; index < count; index++) {
                      NSString *identifier = nil;
                      if (P6YResponds(strongSelf, @"topTabIdentifierWithIndex:")) {
                          identifier = [((id (*)(id, SEL, NSInteger))objc_msgSend)(strongSelf, NSSelectorFromString(@"topTabIdentifierWithIndex:"), index) description].lowercaseString;
                      }
                      BOOL matchFollowing = page == 1 && [identifier containsString:@"follow"];
                      BOOL matchForYou = page == 0 && ([identifier containsString:@"hot"] || [identifier containsString:@"recommend"] || [identifier containsString:@"for_you"] || [identifier containsString:@"foryou"]);
                      if (!matchFollowing && !matchForYou) continue;
                      if (P6YResponds(strongSelf, @"tabItemTypeWithIndex:") && P6YResponds(strongSelf, @"scrollToTab:")) {
                          NSInteger type = ((NSInteger (*)(id, SEL, NSInteger))objc_msgSend)(strongSelf, NSSelectorFromString(@"tabItemTypeWithIndex:"), index);
                          ((void (*)(id, SEL, NSInteger))objc_msgSend)(strongSelf, NSSelectorFromString(@"scrollToTab:"), type);
                      } else if (P6YResponds(strongSelf, @"setCurrentIndex:")) {
                          ((void (*)(id, SEL, NSInteger))objc_msgSend)(strongSelf, NSSelectorFromString(@"setCurrentIndex:"), index);
                      }
                      break;
                  }
              });
          }

          '''
          if "static void P6YScheduleStartupPage" not in tweak:
              insertion = tweak.index("%hook AWEFeedContainerViewController")
              tweak = tweak[:insertion] + startup_helper + tweak[insertion:]

          tweak = replace_hook(tweak, "AWEFeedContainerViewController", r'''%hook AWEFeedContainerViewController
          - (void)viewDidAppear:(BOOL)animated {
              %orig(animated);
              if ([objc_getAssociatedObject(self, P6YStartupAppliedKey) boolValue]) return;
              objc_setAssociatedObject(self, P6YStartupAppliedKey, @YES, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              NSInteger page = [P6YManager integerForKey:@"p6y_startup_page"];
              P6YScheduleStartupPage(self, page);
          }
          %end''')

          if tweak.count("static void P6YConfirmVoidAction") != 1:
              raise SystemExit("Tweak.x still has duplicate void confirmation helpers")
          if tweak.count("static void P6YConfirmObjectAction") != 1:
              raise SystemExit("Tweak.x still has duplicate object confirmation helpers")
          if "{ %orig;" in tweak or "%orig; return;" in tweak:
              raise SystemExit("Tweak.x still contains inline Logos orig control flow")
          tweak_path.write_text(tweak, encoding="utf-8")

          live_path = Path("P6YLiveZoom.x")
          live = live_path.read_text(encoding="utf-8")
          schedule_live = r'''static void P6YScheduleLiveZoomInstall(UIViewController *controller) {
              __weak UIViewController *weakController = controller;
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIViewController *strongController = weakController;
                  if (strongController) P6YInstallLiveZoomGestures(strongController);
              });
          }

          '''
          if "static void P6YScheduleLiveZoomInstall" not in live:
              insertion = live.index("%hook UIViewController")
              live = live[:insertion] + schedule_live + live[insertion:]
          live = replace_hook(live, "UIViewController", r'''%hook UIViewController

          - (void)viewDidAppear:(BOOL)animated {
              %orig(animated);
              if (P6YLooksLikeLiveRoomController(self)) P6YScheduleLiveZoomInstall(self);
          }

          - (void)viewDidDisappear:(BOOL)animated {
              if (P6YLooksLikeLiveRoomController(self)) P6YResetLiveZoom(self, NO);
              %orig(animated);
          }

          %new
          - (void)p6y_handleLivePinch:(UIPinchGestureRecognizer *)gesture {
              if (![P6YManager boolForKey:@"p6y_live_zoom"] || !P6YLooksLikeLiveRoomController(self)) return;

              if (gesture.state == UIGestureRecognizerStateBegan) {
                  UIView *target = P6YLiveVideoView(self);
                  if (!target) return;

                  NSNumber *current = objc_getAssociatedObject(self, P6YLiveCurrentScaleKey) ?: @(1.0);
                  objc_setAssociatedObject(self, P6YLiveStartScaleKey, current, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  objc_setAssociatedObject(self, P6YLiveZoomTargetKey, target, OBJC_ASSOCIATION_ASSIGN);
                  if (!objc_getAssociatedObject(self, P6YLiveOriginalTransformKey)) {
                      objc_setAssociatedObject(self, P6YLiveOriginalTransformKey, P6YTransformValue(target.transform), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
                  target.superview.clipsToBounds = YES;
              }

              UIView *target = objc_getAssociatedObject(self, P6YLiveZoomTargetKey);
              if (!target) return;

              CGFloat startScale = [objc_getAssociatedObject(self, P6YLiveStartScaleKey) doubleValue];
              CGFloat scale = MIN(4.0, MAX(1.0, startScale * gesture.scale));
              CGAffineTransform original = P6YTransformFromValue(objc_getAssociatedObject(self, P6YLiveOriginalTransformKey));
              target.transform = CGAffineTransformScale(original, scale, scale);
              objc_setAssociatedObject(self, P6YLiveCurrentScaleKey, @(scale), OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              if ((gesture.state == UIGestureRecognizerStateEnded || gesture.state == UIGestureRecognizerStateCancelled) && scale <= 1.01) {
                  P6YResetLiveZoom(self, YES);
              }
          }

          %new
          - (void)p6y_resetLiveZoom:(UITapGestureRecognizer *)gesture {
              if (gesture.state == UIGestureRecognizerStateRecognized) P6YResetLiveZoom(self, YES);
          }

          %new
          - (BOOL)gestureRecognizerShouldBegin:(UIGestureRecognizer *)gesture {
              UIPinchGestureRecognizer *pinch = objc_getAssociatedObject(self, P6YLivePinchKey);
              UITapGestureRecognizer *reset = objc_getAssociatedObject(self, P6YLiveResetTapKey);
              if (gesture != pinch && gesture != reset) return YES;
              if (![P6YManager boolForKey:@"p6y_live_zoom"] || !P6YLooksLikeLiveRoomController(self)) return NO;

              if (gesture == reset) {
                  return [objc_getAssociatedObject(self, P6YLiveCurrentScaleKey) doubleValue] > 1.01;
              }

              BOOL stateKnown = NO;
              BOOL cleared = P6YLiveInterfaceIsCleared(self, &stateKnown);
              return !stateKnown || cleared;
          }

          %new
          - (BOOL)gestureRecognizer:(UIGestureRecognizer *)gesture shouldRecognizeSimultaneouslyWithGestureRecognizer:(UIGestureRecognizer *)otherGesture {
              UIPinchGestureRecognizer *pinch = objc_getAssociatedObject(self, P6YLivePinchKey);
              UITapGestureRecognizer *reset = objc_getAssociatedObject(self, P6YLiveResetTapKey);
              return gesture == pinch || gesture == reset || otherGesture == pinch || otherGesture == reset;
          }

          %end''')
          live_path.write_text(live, encoding="utf-8")

          follower_path = Path("P6YFollowerTracker.x")
          follower = follower_path.read_text(encoding="utf-8")
          follower = follower.replace("    %orig;\n    P6YFollowerUpdateButton(self, model", "    %orig(model);\n    P6YFollowerUpdateButton(self, model", 1)
          follower = follower.replace("    %orig;\n    P6YFollowerUpdateButton(self, user);", "    %orig(user);\n    P6YFollowerUpdateButton(self, user);", 2)
          follower_path.write_text(follower, encoding="utf-8")

          quality_path = Path("P6YMediaQuality.x")
          quality = quality_path.read_text(encoding="utf-8")
          old_ctor = r'''%ctor {
              %init;
              dispatch_async(dispatch_get_main_queue(), ^{
                  P6YInstallHighestQualityVideoGetter();
                  P6YInstallDownloadResolutionHooks();
                  P6YInstallProfilePhotoHook();
              });
          }'''
          new_ctor = r'''static void P6YScheduleQualityHookInstall(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  P6YInstallHighestQualityVideoGetter();
                  P6YInstallDownloadResolutionHooks();
                  P6YInstallProfilePhotoHook();
              });
          }

          %ctor {
              %init;
              P6YScheduleQualityHookInstall();
          }'''
          if old_ctor not in quality:
              raise SystemExit("Expected P6YMediaQuality ctor was not found")
          quality = quality.replace(old_ctor, new_ctor, 1)
          quality_path.write_text(quality, encoding="utf-8")

          for source in Path('.').glob('*.x'):
              text = source.read_text(encoding='utf-8')
              if text.count('%hook') != text.count('%end'):
                  raise SystemExit(f"Unbalanced Logos hook/end count in {source}")
              if '{ %orig;' in text or '%orig; return;' in text:
                  raise SystemExit(f"Inline Logos orig control flow remains in {source}")

          Path(".github/workflows/source-repair.yml").unlink()
          PY

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tweak.x P6YLiveZoom.x P6YFollowerTracker.x P6YMediaQuality.x .github/workflows/source-repair.yml
          git commit -m "Repair all risky Logos hook patterns"
          git push origin HEAD:revive-tiktok-46.1.0
