name: Apply login-safe validator fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-login-safe-validator-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Allow each dylib's own install name
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-login-safe-tweak.yml')
          text = path.read_text()
          old = '''            local dependency_report="$GITHUB_WORKSPACE/dist/reports/${label}-dependencies.txt"

            file "$dylib" | tee "$GITHUB_WORKSPACE/dist/reports/${label}-file.txt"
'''
          new = '''            local dependency_report="$GITHUB_WORKSPACE/dist/reports/${label}-dependencies.txt"
            local own_install_name="/Library/MobileSubstrate/DynamicLibraries/$(basename "$dylib")"

            file "$dylib" | tee "$GITHUB_WORKSPACE/dist/reports/${label}-file.txt"
'''
          if old not in text:
              raise SystemExit('validator declaration block did not match')
          text = text.replace(old, new, 1)

          old = '''                /System/Library/*|/usr/lib/*|@*) ;;
'''
          new = '''                /System/Library/*|/usr/lib/*|@*|"$own_install_name") ;;
'''
          if old not in text:
              raise SystemExit('validator allowlist did not match')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-login-safe-tweak.yml
          git commit -m "ci: allow dylibs' own install names"
          git push origin HEAD:main

# Existing workflow touch: second trigger with status reporting enabled.
