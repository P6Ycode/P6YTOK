name: Clean Tweak confirmation hooks

on:
  push:
    branches:
      - revive-tiktok-46.1.0
    paths:
      - .github/workflows/fix-tweak-confirmations.yml

permissions:
  contents: write

jobs:
  clean-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: revive-tiktok-46.1.0
          fetch-depth: 0

      - name: Replace duplicated confirmation helpers
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Tweak.x")
          text = path.read_text(encoding="utf-8")
          start_marker = "static void P6YConfirmVoidAction"
          end_marker = "%hook AWEFeedVideoButton"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the confirmation helper section")

          helpers = r'''static void P6YConfirmVoidAction(id object, const void *bypassKey, SEL selector, NSString *message) {
              __weak id weakObject = object;
              [P6YManager presentConfirmationWithTitle:@"P6YTOK" message:message from:nil confirmed:^{
                  id strongObject = weakObject;
                  if (!strongObject) return;
                  objc_setAssociatedObject(strongObject, bypassKey, @YES, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  ((void (*)(id, SEL))objc_msgSend)(strongObject, selector);
              }];
          }

          static void P6YConfirmObjectAction(id object, id argument, const void *bypassKey, SEL selector, NSString *message) {
              __weak id weakObject = object;
              [P6YManager presentConfirmationWithTitle:@"P6YTOK" message:message from:nil confirmed:^{
                  id strongObject = weakObject;
                  if (!strongObject) return;
                  objc_setAssociatedObject(strongObject, bypassKey, @YES, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  ((void (*)(id, SEL, id))objc_msgSend)(strongObject, selector, argument);
              }];
          }

          '''

          cleaned = text[:start] + helpers + text[end:]
          if cleaned.count("static void P6YConfirmVoidAction") != 1:
              raise SystemExit("Void confirmation helper was not deduplicated")
          if cleaned.count("static void P6YConfirmObjectAction") != 1:
              raise SystemExit("Object confirmation helper was not deduplicated")
          if "P6YConfirmObjectAction(self, sender" not in cleaned:
              raise SystemExit("Comment confirmation hooks are not using the helper")

          path.write_text(cleaned, encoding="utf-8")
          Path(".github/workflows/fix-tweak-confirmations.yml").unlink()
          PY

      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tweak.x .github/workflows/fix-tweak-confirmations.yml
          git commit -m "Fix Logos confirmation hook syntax"
          git push origin HEAD:revive-tiktok-46.1.0
