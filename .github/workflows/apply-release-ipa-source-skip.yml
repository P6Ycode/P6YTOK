name: Apply generated IPA source exclusion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-release-ipa-source-skip.yml

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Exclude generated release IPA from source discovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-login-safe-tweak.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          target = 'matches = name == requested_name if requested_name else name.lower().endswith(".ipa")'

          matches = [
              index for index, line in enumerate(lines)
              if line.strip() == target
              and index > 0
              and lines[index - 1].strip() == 'name = asset.get("name", "")'
          ]
          if len(matches) != 1:
              raise SystemExit(f'release IPA selector match count was {len(matches)}, expected 1')

          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          lines[index:index] = [
              f'{indent}if name == "P6YTOK-login-safe-unsigned.ipa":',
              f'{indent}    continue',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-login-safe-tweak.yml
          git commit -m "ci: exclude generated IPA from release source discovery"
          git push origin HEAD:main

      - name: Report exclusion status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) state=success ;;
            *) state=failure ;;
          esac
          payload="$(python3 - "$state" "$RUN_URL" "$RESULT" <<'PY'
          import json
          import sys
          state, target_url, result = sys.argv[1:]
          print(json.dumps({
              "state": state,
              "context": "exclude-generated-ipa",
              "description": f"Generated IPA exclusion {result}"[:140],
              "target_url": target_url,
          }))
          PY
          )"
          curl --fail-with-body --location --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
