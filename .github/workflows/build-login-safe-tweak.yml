name: Build login-safe P6YTOK IPA artifacts

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional direct URL override for a user-provided decrypted TikTok IPA"
        required: false
        default: ""
      release_asset_name:
        description: "Optional exact .ipa asset name from this repository's Releases"
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p6ytok-login-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bootstrap, delayed payload, and unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned build dependencies
        run: |
          set -euo pipefail
          brew install make ldid xz dpkg

          python3 -m venv "$RUNNER_TEMP/p6y-lief-venv"
          "$RUNNER_TEMP/p6y-lief-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/p6y-lief-venv/bin/python" -m pip install "lief==1.0.0"
          echo "$RUNNER_TEMP/p6y-lief-venv/bin" >> "$GITHUB_PATH"

          git clone --depth=1 --recursive --shallow-submodules https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git -C "$HOME/theos" rev-parse HEAD | tee "$RUNNER_TEMP/theos-commit.txt"

      - name: Preflight source and tooling
        run: |
          set -euo pipefail
          bash -n scripts/wire_p6ycompat.sh
          bash -n scripts/package_p6ytok_ipa.sh
          plutil -lint P6YTOK.plist P6YBootstrap.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :Filter:Executables:0' P6YTOK.plist)" = "TikTok"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Filter:Executables:0' P6YBootstrap.plist)" = "TikTok"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Filter:Bundles:0' P6YTOK.plist)" = "com.zhiliaoapp.musically"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Filter:Bundles:0' P6YBootstrap.plist)" = "com.zhiliaoapp.musically"
          test -s Makefile
          test -s Tweak.x
          test -s control
          grep -Fxq 'Architecture: iphoneos-arm64' control
          test -s P6YCompat/P6YCompatCore.m
          test -s P6YCompat/P6YCompatCore.h
          test -s P6YCompat/P6YDelayedInit.xm
          test -s P6YCompat/P6YDelayedGroups.xm
          gmake --version | sed -n '1p'
          python3 - <<'PY'
          from importlib.metadata import version
          import lief

          installed = version("lief")
          print(f"LIEF version: {installed}")
          if installed != "1.0.0":
              raise SystemExit(f"Unexpected LIEF version: {installed}")
          PY

      - name: Wire delayed payload and login-safe bootstrap
        id: wire
        run: |
          set -euo pipefail
          chmod +x scripts/wire_p6ycompat.sh
          scripts/wire_p6ycompat.sh "$GITHUB_WORKSPACE" | tee wire-output.txt

          for key in project_dir makefile target_name payload_dylib bootstrap_dylib payload_generator payload_filter bootstrap_filter; do
            value="$(awk -F= -v key="$key" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' wire-output.txt)"
            if [ -z "$value" ]; then
              echo "Could not determine $key from wire script output." >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Record resolved project layout
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist/build dist/reports
          find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -not -path '*/.git/*' | sort > dist/build/source-files.txt

          if [ -n "${{ steps.wire.outputs.makefile }}" ] && [ -f "${{ steps.wire.outputs.makefile }}" ]; then
            cp "${{ steps.wire.outputs.makefile }}" dist/build/ResolvedMakefile
          fi
          if [ -f wire-output.txt ]; then
            cp wire-output.txt dist/build/
          fi
          if [ -f "$RUNNER_TEMP/theos-commit.txt" ]; then
            cp "$RUNNER_TEMP/theos-commit.txt" dist/reports/
          fi

          {
            echo "target_name=${{ steps.wire.outputs.target_name }}"
            echo "payload_dylib=${{ steps.wire.outputs.payload_dylib }}"
            echo "bootstrap_dylib=${{ steps.wire.outputs.bootstrap_dylib }}"
            echo "payload_generator=${{ steps.wire.outputs.payload_generator }}"
            echo "payload_filter=${{ steps.wire.outputs.payload_filter }}"
            echo "bootstrap_filter=${{ steps.wire.outputs.bootstrap_filter }}"
          } > dist/reports/build-resolution.txt

      - name: Verify self-contained Logos runtime
        run: |
          set -euo pipefail
          if [ "${{ steps.wire.outputs.payload_generator }}" != "internal" ]; then
            echo "The delayed payload contains %hookf or forces a non-internal Logos generator." >&2
            echo "A compatible hook runtime would be required before this can be a self-contained IPA build." >&2
            exit 1
          fi

      - name: Build and package both dylibs
        working-directory: ${{ steps.wire.outputs.project_dir }}
        env:
          THEOS: ${{ env.THEOS }}
          FINALPACKAGE: "1"
          TARGET: iphone:clang:latest:14.0
        run: |
          set -euo pipefail
          jobs="$(sysctl -n hw.logicalcpu)"
          gmake clean
          gmake -j"$jobs" package FINALPACKAGE=1 2>&1 | tee "$GITHUB_WORKSPACE/dist/build/make-package.log"

      - name: Collect and validate tweak artifacts
        working-directory: ${{ steps.wire.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/deb" \
                   "$GITHUB_WORKSPACE/dist/dylib" \
                   "$GITHUB_WORKSPACE/dist/layout" \
                   "$GITHUB_WORKSPACE/dist/reports" \
                   "$GITHUB_WORKSPACE/dist/scripts"

          find . -type f -path '*/packages/*.deb' -print -exec cp {} "$GITHUB_WORKSPACE/dist/deb/" \;

          shopt -s nullglob
          debs=("$GITHUB_WORKSPACE"/dist/deb/*.deb)
          if [ ${#debs[@]} -ne 1 ]; then
            echo "Expected exactly one .deb package; found ${#debs[@]}." >&2
            exit 1
          fi

          deb="${debs[0]}"
          dpkg-deb --info "$deb" | tee "$GITHUB_WORKSPACE/dist/reports/deb-info.txt"
          out="$GITHUB_WORKSPACE/dist/layout/$(basename "$deb" .deb)"
          mkdir -p "$out"
          dpkg-deb -x "$deb" "$out"

          bootstrap_count="$(find "$out" -type f -name '${{ steps.wire.outputs.bootstrap_dylib }}' | wc -l | tr -d ' ')"
          payload_count="$(find "$out" -type f -name '${{ steps.wire.outputs.payload_dylib }}' | wc -l | tr -d ' ')"
          if [ "$bootstrap_count" != "1" ]; then
            echo "Expected one bootstrap dylib; found $bootstrap_count." >&2
            exit 1
          fi
          if [ "$payload_count" != "1" ]; then
            echo "Expected one delayed payload dylib; found $payload_count." >&2
            exit 1
          fi

          bootstrap="$(find "$out" -type f -name '${{ steps.wire.outputs.bootstrap_dylib }}')"
          payload="$(find "$out" -type f -name '${{ steps.wire.outputs.payload_dylib }}')"

          for filter_name in P6YBootstrap.plist "${{ steps.wire.outputs.target_name }}.plist"; do
            filter_count="$(find "$out" -type f -name "$filter_name" | wc -l | tr -d ' ')"
            if [ "$filter_count" != "1" ]; then
              echo "Expected one staged filter $filter_name; found $filter_count." >&2
              exit 1
            fi
          done

          cp "$bootstrap" "$GITHUB_WORKSPACE/dist/dylib/P6YBootstrap.dylib"
          cp "$payload" "$GITHUB_WORKSPACE/dist/dylib/${{ steps.wire.outputs.payload_dylib }}"
          chmod 0755 "$GITHUB_WORKSPACE/dist/dylib/"*.dylib

          validate_dylib() {
            local dylib="$1"
            local label="$2"
            local dependency_report="$GITHUB_WORKSPACE/dist/reports/${label}-dependencies.txt"
            local own_install_name="/Library/MobileSubstrate/DynamicLibraries/$(basename "$dylib")"

            file "$dylib" | tee "$GITHUB_WORKSPACE/dist/reports/${label}-file.txt"
            lipo -archs "$dylib" | tee "$GITHUB_WORKSPACE/dist/reports/${label}-architectures.txt"
            if ! lipo -archs "$dylib" | grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)'; then
              echo "$label does not contain an arm64 slice." >&2
              exit 1
            fi

            otool -D "$dylib" | tee "$GITHUB_WORKSPACE/dist/reports/${label}-install-name.txt"
            otool -L "$dylib" | tee "$dependency_report"

            while IFS= read -r dependency; do
              case "$dependency" in
                "$own_install_name"|/System/Library/*|/usr/lib/*|@*) ;;
                *)
                  echo "Unsupported dependency in $label: $dependency" >&2
                  exit 1
                  ;;
              esac
            done < <(awk 'NR > 1 {print $1}' "$dependency_report")
          }

          validate_dylib "$GITHUB_WORKSPACE/dist/dylib/P6YBootstrap.dylib" bootstrap
          validate_dylib "$GITHUB_WORKSPACE/dist/dylib/${{ steps.wire.outputs.payload_dylib }}" payload

          cp "$GITHUB_WORKSPACE/scripts/package_p6ytok_ipa.sh" "$GITHUB_WORKSPACE/dist/scripts/"

          cat > "$GITHUB_WORKSPACE/dist/README.txt" <<EOF
          This artifact contains the login-safe two-dylib P6YTOK test build.

          - dylib/P6YBootstrap.dylib: injected into TikTok's main executable.
          - dylib/${{ steps.wire.outputs.payload_dylib }}: loaded only after verified normal TikTok UI appears.
          - ipa/P6YTOK-login-safe-unsigned.ipa: unsigned injected IPA built from the release asset.
          - layout/: unpacked Theos package, including filters and resources.
          - reports/: source, package, architecture, dependency, and IPA validation reports.
          - build/make-package.log: complete Theos build output.
          - build/package-ipa.log: complete IPA packaging output.

          This build currently uses a minimal delayed payload for login-path testing. The generated IPA must be signed before installation.
          EOF

      - name: Resolve and verify decrypted TikTok IPA
        id: ipa
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_IPA_URL: ${{ github.event.inputs.ipa_url || '' }}
          REQUESTED_RELEASE_ASSET: ${{ github.event.inputs.release_asset_name || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist/ipa" "$GITHUB_WORKSPACE/dist/reports"
          ipa="$GITHUB_WORKSPACE/user-provided.ipa"
          source_kind=""
          source_name=""
          release_tag=""

          if [ -n "${REQUESTED_IPA_URL:-}" ]; then
            source_kind="manual-url"
            source_name="$(basename "${REQUESTED_IPA_URL%%\?*}")"
            curl --fail --location --retry 3 "$REQUESTED_IPA_URL" -o "$ipa"
          else
            releases_json="$RUNNER_TEMP/p6y-releases.json"
            selection_json="$RUNNER_TEMP/p6y-ipa-selection.json"

            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              -o "$releases_json"

            python3 - "$REQUESTED_RELEASE_ASSET" "$releases_json" "$selection_json" <<'PY'
          import json
          import sys

          requested_name, releases_path, selection_path = sys.argv[1:]
          with open(releases_path, "r", encoding="utf-8") as handle:
              releases = json.load(handle)

          selected = None
          selected_release = None
          for release in releases:
              if release.get("draft"):
                  continue
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  if name == "P6YTOK-login-safe-unsigned.ipa":
                      continue
                  matches = name == requested_name if requested_name else name.lower().endswith(".ipa")
                  if matches:
                      selected = asset
                      selected_release = release
                      break
              if selected:
                  break

          if not selected:
              suffix = f" named {requested_name!r}" if requested_name else ""
              raise SystemExit(f"No published .ipa release asset{suffix} was found.")

          with open(selection_path, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "asset_api_url": selected["url"],
                      "asset_name": selected["name"],
                      "asset_size": selected.get("size", 0),
                      "release_tag": selected_release.get("tag_name", ""),
                  },
                  handle,
              )
          PY

            asset_api_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset_api_url"])' "$selection_json")"
            source_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset_name"])' "$selection_json")"
            release_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_tag"])' "$selection_json")"
            source_kind="github-release"

            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$asset_api_url" \
              -o "$ipa"
          fi

          ipa_size="$(stat -f%z "$ipa")"
          if [ "$ipa_size" -lt 1048576 ]; then
            echo "Downloaded IPA is unexpectedly small: $ipa_size bytes." >&2
            exit 1
          fi
          unzip -tq "$ipa" >/dev/null

          metadata_dir="$RUNNER_TEMP/p6y-ipa-metadata"
          rm -rf "$metadata_dir"
          mkdir -p "$metadata_dir"
          unzip -q "$ipa" 'Payload/*.app/Info.plist' -d "$metadata_dir"

          shopt -s nullglob
          info_plists=("$metadata_dir"/Payload/*.app/Info.plist)
          if [ ${#info_plists[@]} -ne 1 ]; then
            echo "Expected one main app Info.plist; found ${#info_plists[@]}." >&2
            exit 1
          fi
          info_plist="${info_plists[0]}"

          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"

          if [ "$app_version" != "46.1.0" ]; then
            echo "Expected TikTok 46.1.0, but the release IPA reports version $app_version." >&2
            exit 1
          fi

          bundle_id_lower="$(printf '%s' "$bundle_id" | tr '[:upper:]' '[:lower:]')"
          case "$bundle_id_lower" in
            *musically*|*tiktok*) ;;
            *)
              echo "The selected IPA does not look like TikTok: bundle id $bundle_id" >&2
              exit 1
              ;;
          esac

          unzip -q "$ipa" "Payload/*.app/$executable_name" -d "$metadata_dir"
          executables=("$metadata_dir"/Payload/*.app/"$executable_name")
          if [ ${#executables[@]} -ne 1 ]; then
            echo "Expected one main executable named $executable_name; found ${#executables[@]}." >&2
            exit 1
          fi
          executable="${executables[0]}"

          file "$executable" | tee "$GITHUB_WORKSPACE/dist/reports/ipa-executable-file.txt"
          lipo -archs "$executable" | tee "$GITHUB_WORKSPACE/dist/reports/ipa-executable-architectures.txt"
          if ! lipo -archs "$executable" | grep -Eq '(^|[[:space:]])arm64(e)?([[:space:]]|$)'; then
            echo "TikTok executable has no arm64-compatible slice." >&2
            exit 1
          fi

          cryptids="$(otool -l "$executable" | awk '$1 == "cryptid" {print $2}')"
          if [ -n "$cryptids" ] && printf '%s\n' "$cryptids" | grep -Ev '^0$' >/dev/null; then
            echo "The release IPA is still encrypted; at least one Mach-O slice has cryptid != 0." >&2
            exit 1
          fi

          shasum -a 256 "$ipa" | tee "$GITHUB_WORKSPACE/dist/reports/source-ipa-sha256.txt"
          {
            echo "source_kind=$source_kind"
            echo "source_name=$source_name"
            echo "release_tag=$release_tag"
            echo "size_bytes=$ipa_size"
            echo "version=$app_version"
            echo "bundle_id=$bundle_id"
            echo "executable=$executable_name"
            echo "cryptids=${cryptids:-none}"
          } | tee "$GITHUB_WORKSPACE/dist/reports/ipa-source.txt"

          echo "ipa_path=$ipa" >> "$GITHUB_OUTPUT"
          echo "source_name=$source_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build and verify unsigned injected IPA
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/scripts/package_p6ytok_ipa.sh"
          shopt -s nullglob
          layouts=("$GITHUB_WORKSPACE"/dist/layout/*)
          if [ ${#layouts[@]} -ne 1 ] || [ ! -d "${layouts[0]}" ]; then
            echo "Expected one unpacked package layout; found ${#layouts[@]}." >&2
            exit 1
          fi
          layout="${layouts[0]}"

          "$GITHUB_WORKSPACE/scripts/package_p6ytok_ipa.sh" \
            --ipa "${{ steps.ipa.outputs.ipa_path }}" \
            --bootstrap "$GITHUB_WORKSPACE/dist/dylib/P6YBootstrap.dylib" \
            --payload "$GITHUB_WORKSPACE/dist/dylib/${{ steps.wire.outputs.payload_dylib }}" \
            --layout "$layout" \
            --output "$GITHUB_WORKSPACE/dist/ipa/P6YTOK-login-safe-unsigned.ipa" \
            2>&1 | tee "$GITHUB_WORKSPACE/dist/build/package-ipa.log"

          shasum -a 256 "$GITHUB_WORKSPACE/dist/ipa/P6YTOK-login-safe-unsigned.ipa" \
            | tee "$GITHUB_WORKSPACE/dist/reports/ipa-sha256.txt"

      - name: Upload login-safe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6ytok-login-safe-artifacts
          path: dist/
          if-no-files-found: warn
